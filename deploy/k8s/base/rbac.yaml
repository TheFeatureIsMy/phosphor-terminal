apiVersion: v1
kind: ServiceAccount
metadata:
  name: alphaloop-api
  namespace: alphaloop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alphaloop-tenant-runtime
  namespace: alphaloop
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alphaloop-api-tenant-runtime
  namespace: alphaloop
subjects:
  - kind: ServiceAccount
    name: alphaloop-api
    namespace: alphaloop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alphaloop-tenant-runtime
