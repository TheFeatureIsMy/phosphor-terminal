# Do not commit real values. Create with:
#   kubectl -n alphaloop create secret generic alphaloop-secrets \
#     --from-literal=DATABASE_URL=... --from-literal=DATABASE_URL_WORKER=... \
#     --from-literal=SECRET_KEY=... --from-literal=PULSEDESK_ENCRYPTION_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: alphaloop-secrets
  namespace: alphaloop
type: Opaque
stringData:
  DATABASE_URL: postgresql://alphaloop_app:CHANGE_ME@postgres:5432/pulsedesk
  DATABASE_URL_WORKER: postgresql://alphaloop_worker:CHANGE_ME@postgres:5432/pulsedesk
  SECRET_KEY: CHANGE_ME
  PULSEDESK_ENCRYPTION_KEY: CHANGE_ME
