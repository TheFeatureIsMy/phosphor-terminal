apiVersion: batch/v1
kind: Job
metadata:
  name: alphaloop-migrate
  namespace: alphaloop
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/example/alphaloop-api:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: alphaloop-config
            - secretRef:
                name: alphaloop-secrets
