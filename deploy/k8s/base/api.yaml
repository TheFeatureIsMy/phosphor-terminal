apiVersion: apps/v1
kind: Deployment
metadata:
  name: alphaloop-api
  namespace: alphaloop
spec:
  replicas: 2
  selector:
    matchLabels: { app: alphaloop-api }
  template:
    metadata:
      labels: { app: alphaloop-api }
    spec:
      serviceAccountName: alphaloop-api
      volumes:
        - name: tenant-data
          persistentVolumeClaim: { claimName: alphaloop-tenant-data }
      containers:
        - name: api
          image: ghcr.io/example/alphaloop-api:latest
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: alphaloop-config }
            - secretRef: { name: alphaloop-secrets }
          volumeMounts:
            - { name: tenant-data, mountPath: /var/lib/alphaloop/tenants }
          readinessProbe:
            httpGet: { path: /readiness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: alphaloop-api
  namespace: alphaloop
spec:
  selector: { app: alphaloop-api }
  ports:
    - { name: http, port: 8000, targetPort: http }
