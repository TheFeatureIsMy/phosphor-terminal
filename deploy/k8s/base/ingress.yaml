apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alphaloop
  namespace: alphaloop
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.example.com]
      secretName: alphaloop-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alphaloop-web
                port: { number: 80 }
