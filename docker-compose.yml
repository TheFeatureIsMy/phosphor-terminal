version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pulsedesk
      POSTGRES_PASSWORD: pulsedesk
      POSTGRES_DB: pulsedesk
      # Consumed by deploy/postgres/init-tenant-roles.sh on a fresh volume.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-pulsedesk_app}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-pulsedesk_worker}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-tenant-roles.sh:/docker-entrypoint-initdb.d/10-tenant-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsedesk"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped


  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./freqtrade/user_data:/freqtrade/user_data
    environment:
      # Defaults to the owner for compatibility; set to alphaloop_app after the
      # migration + role steps in docs/operations/multi-tenant-upgrade.md.
      DATABASE_URL: ${DATABASE_URL:-postgresql://pulsedesk:pulsedesk@postgres:5432/pulsedesk}
      # Optional BYPASSRLS role for workers (created by the postgres init script).
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER:-postgresql://pulsedesk:pulsedesk@postgres:5432/pulsedesk}
      REDIS_URL: redis://redis:6379/0
      FREQTRADE_URL: http://freqtrade:8080
      FREQTRADE_DB_PATH: /freqtrade/user_data/tradesv3.sqlite
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      # Remote deployments must provide real secrets; with APP_ENV=production
      # the API refuses to start when these are missing or use dev defaults.
      APP_ENV: ${APP_ENV:-production}
      SERVER_HOST: 0.0.0.0
      ALLOWED_HOSTS: '${ALLOWED_HOSTS:-["localhost","127.0.0.1"]}'
      SECRET_KEY: ${SECRET_KEY:-}
      PULSEDESK_ENCRYPTION_KEY: ${PULSEDESK_ENCRYPTION_KEY:-}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readiness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      freqtrade:
        condition: service_started
    restart: unless-stopped

  freqtrade:
    image: freqtradeorg/freqtrade:stable
    volumes:
      - ./freqtrade/user_data:/freqtrade/user_data
      - ./backend:/backend:ro
    ports:
      - "8080:8080"
    environment:
      - PULSEDESK_REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/backend
    command: >
      trade
      --strategy PulseDeskUniversalStrategy
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --config /freqtrade/user_data/config.json
      --dry-run
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
