# Production override. Use:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required environment (compose refuses to start when unset):
#   DATABASE_URL, DATABASE_URL_WORKER, SECRET_KEY, PULSEDESK_ENCRYPTION_KEY,
#   CORS_ORIGINS, PUBLIC_BASE_URL
services:
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      PULSEDESK_ENCRYPTION_KEY: ${PULSEDESK_ENCRYPTION_KEY:?set PULSEDESK_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    # No source bind mount in production: the image is immutable.
    # `!override` requires Docker Compose >= 2.24.4.
    volumes: !override
      - ./freqtrade/user_data:/freqtrade/user_data
      - tenantdata:/var/lib/alphaloop/tenants
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER:?set DATABASE_URL_WORKER}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      PULSEDESK_ENCRYPTION_KEY: ${PULSEDESK_ENCRYPTION_KEY:?set PULSEDESK_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      TENANT_DATA_ROOT: /var/lib/alphaloop/tenants
      APP_ENV: production
      AUTH_REQUIRED: "true"
      BACKGROUND_LOOPS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped


  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker_main"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER:?set DATABASE_URL_WORKER}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      PULSEDESK_ENCRYPTION_KEY: ${PULSEDESK_ENCRYPTION_KEY:?set PULSEDESK_ENCRYPTION_KEY}
      APP_ENV: production
      AUTH_REQUIRED: "true"
    volumes:
      - ./freqtrade/user_data:/freqtrade/user_data
      - tenantdata:/var/lib/alphaloop/tenants
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  tenantdata:
